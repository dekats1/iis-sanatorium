# Единая точка входа для браузера: статика фронтенда + прокси к шлюзу. Один origin — CORS не нужен.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # X-Forwarded-For ПЕРЕЗАПИСЫВАЕТСЯ реальным адресом клиента (не дописывается): иначе клиент подделает заголовок
    # и обойдёт лимит попыток входа на шлюзе (gateway.trust-forwarded-for=true доверяет именно этому заголовку).
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 15s;
    }

    location /pricing/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 15s;
    }

    # хэшированные файлы сборки можно кэшировать надолго, index.html — нет
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri /index.html;
    }
}
